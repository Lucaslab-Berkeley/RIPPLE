##########################################
### Movie Alignment Configuration File ###
##########################################
# This config file contains all settings for running the align frames manager
# and will output a deformation field plus optional motion corrected output
# sums (dose-weighted and non-dose-weighted) and movies (motion-corrected and
# rendered unaligned).

# --- Computing resources ---
computational_config:
  gpu_id: 0  # (required) Can be an integer (0), a string like "cuda:0", or "cpu". Single GPU execution only.
  keep_movie_on_cpu: false  # (optional, default false) Keep the prepared movie on CPU RAM; stream frames/chunks to GPU as needed.

# --- Input movie plus metadata ---
movie_config:
  movie_path: "movies/my_movie.eer"   # (required)  Path to the movie file (.mrc, .tif, or .eer)
  pixel_size: 0.936                   # (required)  Pixel size in Angstroms per pixel (native/super-resolution pixel size, not the final output pixel size)
  super_resolution_factor: 1          # (optional, default 1)     Integer factor relating pixel_size to the desired output pixel size: output_pixel_size = pixel_size * super_resolution_factor. E.g. 2 for a movie collected at 2x the desired final pixel size.
  fluence: 54.5                       # (required)  Total fluence in electrons per Angstrom^2
  fluence_per_frame: 1.0              # (required)  Fluence per frame in electrons per Angstrom^2/frame
  pre_exposure: 0.0                   #             The total pre-exposure in (e-/A^2) before the first frame of the movie (default: 0.0)
  voltage: 300.0                      #             Accelerating voltage in kilovolts (default: 300.0)
  gain_path: null                     # (optional, default null)  Path to gain map file (.mrc, .tif, .tiff, or .gain); null means no gain reference applied
  dark_path: null                     # (optional, default null)  Path to dark map file (.mrc, .tif, .tiff, or .dark); null means no dark reference applied
  gain_flip: 0                        # (optional, default 0)     Gain/Dark flip: 0 = no flip, 1 = flipY, 2 = flipX
  gain_rot: 0                         # (optional, default 0)     Gain/Dark rotation 0 = no rotation, 1 = 90 deg, 2 = 180 deg , 3 = 270 deg (all CCW)
  multiply_gain: true                 # (optional, default true)  Whether to multiply movie by gain map (True) or divide (False) (default: True)

# --- Output file configuration ---
output_config:
  allow_file_overwrite: false          # Allow writing of pre-existing files, safety mechanism.
  dw_sum_output_path: ../../example/output/dw_sum.mrc                 # (optional)  Path to save dose-weighted sum output, in MRC format. If null, not constructed or saved.
  non_dw_sum_output_path: null                                        # (optional)  Path to save non-dose-weighted sum output, in MRC format. If null, not constructed or saved.
  deformation_field_output_path: ../../example/output/def_field.csv   # (optional)  Path to save estimated deformation field, as .csv/.hdf5 file. If null, not saved; file extension chooses output format
  rendered_movie_output_path: null                                    # (optional)  Path to save pre-processed & rendered movie (gain/dark corrected, hot-pixel adjusted), in MRC format. If null, not saved.
  motion_corrected_movie_output_path: null                            # (optional)  Path to save motion corrected movie (aligned, but not summed frames), in MRC format. If null, not saved.
  loss_trajectories_output_path: null                                 # (optional)  Path to save loss trajectories during optimization, in .csv format. If null, not saved.


# --- Parameters for alignment optimization stage ----
alignment_config:
  # nt = number of frames, nh x nw = spatial control point grid
  # Example: [54, 4, 4] for 54 frames with a 4x4 spatial grid
  deformation_field_resolution: [54, 4, 4]  # (required)                          Resolution of deformation field as (nt, nh, nw).
  deformation_field_path: null              # (optional)                          Path to initial deformation field file (.csv or .hdf5). If null, deformation field initialized to zero.
  use_xc_prepass: true                      # (optional, default true)            Whether to run a fast cross-correlation pre-pass to estimate global per-frame shifts before gradient optimization. The XC shifts seed the initial deformation field. NOTE: Not compatible with 'deformation_field_path' initialization.
  
  max_iterations: 100                       # (required, default 100)             Maximum number of iterations for optimization
  patch_shape: [1024, 1024]                 # (default [1024, 1024])              Shape of extracted movie patches in pixels (width, height)
  grid_type: "catmull_rom"                  # (required, default "catmull_rom")   Type of interpolation grid for deformation field: "catmull_rom" or "bspline"
  loss_type: "ncc"                          # (required, default "mse")           Type of loss function to optimize: "mse", "cc", or "ncc". "mse" = mean square error, "cc" = cross correlation, "ncc" = normalized cross correlation
  optimizer_type: "adam"                    # (required, default "adam")          Type of optimizer for deformation field optimization: "adam" or "lbfgs"
  learning_rate: 0.2                        # (required, default 0.2)             Learning rate for optimization. Higher values may speed up convergence but risk instability; lower values may be more stable but slower.
  b_factor: 500.0                           # (required, default 500.0)           B-factor in Angstroms^2 for frame pre-processing. Higher values down-weight high spatial frequency information more strongly.
  frequency_range: [300.0, 10.0]            # (required, default [300.0, 10.0])   Frequency range in Angstroms band-pass filtering. Values are low-frequency cutoff and high-frequency cutoff.
  skip_movie_preparation: false             # (optional, default false)           Whether to skip movie preparation step (gain/dark correction, hot-pixel adjustment). If true, assumes input movie is already pre-processed and rendered as 3D array of shape (nt, height, width).

  # Plateau-style early stopping (default: false). Enable by setting 'early_stopping' to true.
  # Stops optimization early if smoothed loss change is smaller than 'tolerance' threshold for 'patience' consecutive checks,
  # where smoothed loss is computed by averaging over 'window_size' recent iterations.
  early_stopping: false
  early_stopping_patience: 5          # (required, default 5)
  early_stopping_window_size: 3       # (required, default 3)
  early_stopping_tolerance: 1.0e-5    # (required, default 1e-5)

